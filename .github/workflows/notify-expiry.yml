name: Avvisi scadenze

on:
  schedule:
    # 9:00 in Italia: 7:00 UTC con l'ora legale, 8:00 UTC con l'ora solare.
    # Gira a entrambi gli orari; lo script invia una sola volta, dalle 9 in poi.
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Invia subito, senza aspettare le 9'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save web-push@3.6.7
      - name: Invia gli avvisi
        run: node scripts/notify-expiry.mjs ${{ inputs.force && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
